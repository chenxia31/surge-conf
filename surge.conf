[Proxy Group]
# 机场节点通过 policy-path 引入，节点名保持机场下发原样（见 HANDOFF 第 9 节）。
#
# 用法：把下方 <SUB_URL> 替换为机场订阅链接，并在链接末尾追加 &list=true
#   —— list=true 让 subconverter 只输出 [Proxy] 节点列表，正是 policy-path 需要的格式；
#      不加会返回整份 conf，policy-path 无法解析。
#
# 订阅链接含 token，等同账号凭证。本仓库为 public，禁止把真实链接提交上来：
# 请在设备本地的配置副本中填写，或把主配置放在 secret gist 中。

Proxies = select, HK, JP, SG, TW, US, DIRECT

HK = select, policy-path=<SUB_URL>&list=true, policy-regex-filter=香港, update-interval=86400
JP = select, policy-path=<SUB_URL>&list=true, policy-regex-filter=日本, update-interval=86400
SG = select, policy-path=<SUB_URL>&list=true, policy-regex-filter=新加坡, update-interval=86400
TW = select, policy-path=<SUB_URL>&list=true, policy-regex-filter=台湾, update-interval=86400
US = select, policy-path=<SUB_URL>&list=true, policy-regex-filter=美国, update-interval=86400

# 按地区正则过滤，机场用于展示流量/到期的伪节点（Traffic: … / Expire: …）会被自动排除。

YouTube = select,Proxies,HK,JP,SG,TW,US
Disney = select,Proxies,HK,JP,SG,TW,US
Hbomax = select,Proxies,HK,JP,SG,TW,US
Netflix = select,Proxies,HK,JP,SG,TW,US
Bahamut = select,Proxies,HK,TW
Bilibili = select,DIRECT,HK,TW
Spotify = select,Proxies,DIRECT,HK,JP,SG,TW,US
Steam = select,Proxies,DIRECT,HK,JP,SG,TW,US
Telegram = select,Proxies,HK,JP,SG,TW,US
Google = select,Proxies,HK,JP,SG,TW,US
Microsoft = select,Proxies,DIRECT,HK,JP,SG,TW,US
OpenAI = select,Proxies,HK,JP,SG,TW,US
PayPal = select,Proxies,DIRECT,HK,JP,SG,TW,US
Apple = select,Proxies,DIRECT,HK,JP,SG,TW,US
Final = select,Proxies,DIRECT

