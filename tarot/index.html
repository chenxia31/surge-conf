<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>星语塔罗 · 在线塔罗牌占卜</title>
<meta name="description" content="静心冥想,向塔罗提问。完整78张韦特塔罗牌,五种牌阵(单张、时间之流、关系之镜、十字路口、凯尔特十字),根据你的问题给出针对性解答。">
<style>
  :root {
    --bg: #0b0b1a;
    --bg2: #151530;
    --gold: #d4af6a;
    --gold-bright: #f0d495;
    --ink: #e8e2d5;
    --dim: #9a93a8;
    --card-w: 110px;
    --card-h: 187px;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    background: radial-gradient(ellipse at 50% -10%, #232350 0%, var(--bg) 55%);
    color: var(--ink);
    font-family: "Songti SC", "Noto Serif SC", "STSong", serif;
    min-height: 100vh;
    overflow-x: hidden;
  }
  /* ---------- 星空背景 ---------- */
  #stars { position: fixed; inset: 0; z-index: 0; pointer-events: none; }
  .star {
    position: absolute; border-radius: 50%; background: #fff;
    animation: twinkle var(--d) ease-in-out infinite;
    opacity: .7;
  }
  @keyframes twinkle {
    0%, 100% { opacity: .15; transform: scale(.8); }
    50%      { opacity: .9;  transform: scale(1.15); }
  }
  main { position: relative; z-index: 1; max-width: 980px; margin: 0 auto; padding: 0 20px 80px; }

  /* ---------- 头部 ---------- */
  header { text-align: center; padding: 56px 0 8px; }
  .moon { font-size: 40px; filter: drop-shadow(0 0 14px rgba(240,212,149,.6)); }
  h1 {
    font-size: clamp(30px, 6vw, 44px);
    letter-spacing: .35em; text-indent: .35em;
    color: var(--gold-bright); font-weight: 600;
    margin-top: 10px;
    text-shadow: 0 0 24px rgba(212,175,106,.35);
  }
  .subtitle { color: var(--dim); letter-spacing: .2em; margin-top: 12px; font-size: 14px; }
  .divider {
    width: 220px; height: 1px; margin: 28px auto;
    background: linear-gradient(90deg, transparent, var(--gold), transparent);
    position: relative;
  }
  .divider::after {
    content: "✦"; position: absolute; left: 50%; top: 50%;
    transform: translate(-50%, -50%); color: var(--gold);
    background: var(--bg); padding: 0 10px; font-size: 12px;
  }

  /* ---------- 提问 & 牌阵选择 ---------- */
  .panel { text-align: center; }
  .question-box {
    width: min(560px, 100%);
    margin: 0 auto;
    display: block;
    background: rgba(255,255,255,.04);
    border: 1px solid rgba(212,175,106,.35);
    border-radius: 10px;
    color: var(--ink);
    font-family: inherit; font-size: 16px;
    padding: 14px 18px;
    outline: none;
    transition: border-color .3s, box-shadow .3s;
  }
  .question-box:focus { border-color: var(--gold); box-shadow: 0 0 18px rgba(212,175,106,.2); }
  .question-box::placeholder { color: #6d6580; }
  .domain-hint { color: var(--dim); font-size: 13px; margin-top: 10px; min-height: 20px; letter-spacing: .08em; }
  .domain-hint em { color: var(--gold-bright); font-style: normal; }

  .spreads { display: flex; gap: 14px; justify-content: center; flex-wrap: wrap; margin: 28px 0 10px; }
  .spread-btn {
    cursor: pointer; font-family: inherit;
    background: rgba(255,255,255,.03);
    border: 1px solid rgba(212,175,106,.3);
    border-radius: 12px;
    color: var(--ink);
    padding: 14px 16px; width: 172px;
    transition: all .3s;
  }
  .spread-btn .s-name { font-size: 16.5px; color: var(--gold-bright); letter-spacing: .1em; }
  .spread-btn .s-count { font-size: 11px; color: var(--gold); letter-spacing: .15em; margin-top: 4px; }
  .spread-btn .s-desc { font-size: 12.5px; color: var(--dim); margin-top: 7px; line-height: 1.55; }
  .spread-btn:hover, .spread-btn.active {
    border-color: var(--gold);
    background: rgba(212,175,106,.08);
    box-shadow: 0 0 22px rgba(212,175,106,.18);
    transform: translateY(-2px);
  }
  .go-btn {
    cursor: pointer; font-family: inherit;
    margin-top: 26px;
    font-size: 17px; letter-spacing: .3em; text-indent: .3em;
    color: #1c1428;
    background: linear-gradient(135deg, var(--gold-bright), var(--gold));
    border: none; border-radius: 999px;
    padding: 14px 46px;
    transition: all .3s;
    box-shadow: 0 4px 24px rgba(212,175,106,.35);
  }
  .go-btn:hover { transform: translateY(-2px); box-shadow: 0 8px 32px rgba(212,175,106,.5); }

  /* ---------- 洗牌 / 选牌 ---------- */
  .stage { display: none; text-align: center; }
  .stage.show { display: block; animation: fadeIn .6s ease; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
  .hint { color: var(--dim); letter-spacing: .15em; margin: 26px 0 8px; font-size: 15px; min-height: 24px; }
  .hint em { color: var(--gold-bright); font-style: normal; }

  .fan {
    position: relative;
    height: calc(var(--card-h) + 90px);
    margin-top: 10px;
  }
  .fan-card {
    position: absolute; left: 50%; top: 30px;
    width: var(--card-w); height: var(--card-h);
    margin-left: calc(var(--card-w) / -2);
    transform-origin: 50% 120%;
    cursor: pointer;
    transition: transform .45s cubic-bezier(.22,.9,.36,1), opacity .45s;
  }
  .fan-card.shuffling { animation: shuffle .5s ease-in-out infinite alternate; }
  @keyframes shuffle {
    from { transform: rotate(var(--r)) translateY(0); }
    to   { transform: rotate(calc(var(--r) * -0.6)) translateY(-14px); }
  }
  .fan-card:hover:not(.picked) { transform: rotate(var(--r)) translateY(-22px) !important; }
  .fan-card.picked { opacity: 0; pointer-events: none; transform: rotate(0) translateY(-90px) scale(.7) !important; }

  .card-back {
    width: 100%; height: 100%;
    border-radius: 9px;
    border: 1.5px solid rgba(212,175,106,.65);
    background:
      radial-gradient(circle at 50% 50%, rgba(212,175,106,.28) 0, transparent 46%),
      repeating-linear-gradient(45deg, #1d1b3f 0 8px, #232152 8px 16px);
    box-shadow: 0 6px 18px rgba(0,0,0,.55);
    display: flex; align-items: center; justify-content: center;
    font-size: 30px; color: var(--gold);
    text-shadow: 0 0 12px rgba(212,175,106,.8);
    user-select: none;
  }

  /* ---------- 翻牌结果 ---------- */
  .results {
    display: flex; gap: 24px 20px; justify-content: center; flex-wrap: wrap;
    margin-top: 34px;
  }
  .slot { width: 168px; }
  .slot-label { color: var(--gold); letter-spacing: .18em; font-size: 14px; margin-bottom: 4px; }
  .slot-sub { color: var(--dim); font-size: 11.5px; margin-bottom: 10px; letter-spacing: .04em; min-height: 16px; }
  .flip { perspective: 1100px; width: 168px; height: 286px; margin: 0 auto; }
  .flip-inner {
    position: relative; width: 100%; height: 100%;
    transform-style: preserve-3d;
    transition: transform .9s cubic-bezier(.3,.7,.3,1);
  }
  .flip.revealed .flip-inner { transform: rotateY(180deg); }
  .face {
    position: absolute; inset: 0;
    backface-visibility: hidden; -webkit-backface-visibility: hidden;
    border-radius: 11px;
  }
  .face.front { transform: rotateY(180deg); }
  .tarot-face {
    width: 100%; height: 100%;
    border-radius: 11px;
    border: 1.5px solid var(--gold);
    background: linear-gradient(160deg, #241f45 0%, #171232 60%, #1e1440 100%);
    box-shadow: 0 0 26px rgba(212,175,106,.28);
    display: flex; flex-direction: column;
    align-items: center; justify-content: space-between;
    padding: 16px 10px;
  }
  .tarot-face .glyph { font-size: 58px; margin-top: 26px; filter: drop-shadow(0 0 10px rgba(240,212,149,.5)); }
  .tarot-face .cn { font-size: 19px; color: var(--gold-bright); letter-spacing: .12em; }
  .tarot-face .en { font-size: 11px; color: var(--dim); letter-spacing: .08em; margin-top: 5px; }
  .tarot-face .num { font-size: 12px; color: var(--gold); letter-spacing: .2em; }
  .tarot-face.reversed-face .inner-rotate { transform: rotate(180deg); }
  .orientation {
    margin-top: 12px; font-size: 13px; letter-spacing: .2em;
    padding: 3px 14px; border-radius: 999px; display: inline-block;
  }
  .orientation.up  { color: #a8d8a8; border: 1px solid rgba(168,216,168,.4); }
  .orientation.rev { color: #d89a9a; border: 1px solid rgba(216,154,154,.4); }

  /* 10 张牌阵时缩小卡面 */
  .results.dense .slot { width: 128px; }
  .results.dense .flip { width: 128px; height: 218px; }
  .results.dense .tarot-face .glyph { font-size: 40px; margin-top: 14px; }
  .results.dense .tarot-face .cn { font-size: 15px; }
  .results.dense .tarot-face .en { font-size: 9.5px; }

  /* ---------- 解读 ---------- */
  .reading {
    margin-top: 44px; text-align: left;
    display: none;
  }
  .reading.show { display: block; animation: fadeIn .8s ease; }
  .reading-card {
    background: rgba(255,255,255,.035);
    border: 1px solid rgba(212,175,106,.25);
    border-left: 3px solid var(--gold);
    border-radius: 10px;
    padding: 22px 26px;
    margin-bottom: 18px;
    line-height: 1.9;
  }
  .reading-card h3 { color: var(--gold-bright); font-size: 17px; letter-spacing: .12em; margin-bottom: 4px; }
  .reading-card .pos-meaning { color: var(--dim); font-size: 13px; margin-bottom: 10px; }
  .reading-card .keywords { color: var(--gold); font-size: 13.5px; letter-spacing: .06em; margin-bottom: 8px; }
  .reading-card p { color: var(--ink); font-size: 15px; margin-bottom: 6px; }
  .reading-card .domain-line { color: #c9bfa8; font-size: 14px; border-top: 1px dashed rgba(212,175,106,.25); padding-top: 10px; margin-top: 10px; }
  .summary {
    background: rgba(212,175,106,.07);
    border: 1px solid rgba(212,175,106,.4);
    border-radius: 10px;
    padding: 24px 28px; line-height: 2;
    font-size: 15px;
  }
  .summary h3 { color: var(--gold-bright); letter-spacing: .2em; margin-bottom: 10px; font-size: 17px; }
  .summary .answer-line { color: var(--gold-bright); }
  .summary p { margin-bottom: 8px; }
  .again { text-align: center; margin-top: 36px; }
  .link-btn {
    cursor: pointer; font-family: inherit; font-size: 15px;
    background: none; border: 1px solid rgba(212,175,106,.5);
    color: var(--gold); letter-spacing: .2em; text-indent: .2em;
    border-radius: 999px; padding: 11px 38px;
    transition: all .3s;
  }
  .link-btn:hover { background: rgba(212,175,106,.12); box-shadow: 0 0 18px rgba(212,175,106,.25); }

  footer {
    position: relative; z-index: 1;
    text-align: center; color: #565064; font-size: 12.5px;
    padding: 30px 20px 40px; letter-spacing: .1em; line-height: 1.8;
  }

  @media (max-width: 560px) {
    :root { --card-w: 74px; --card-h: 126px; }
    .flip, .slot { width: 138px; }
    .flip { height: 235px; }
    .tarot-face .glyph { font-size: 44px; margin-top: 16px; }
    .tarot-face .cn { font-size: 16px; }
    .results { gap: 18px 10px; }
    .results.dense .slot { width: 105px; }
    .results.dense .flip { width: 105px; height: 178px; }
    .results.dense .tarot-face .glyph { font-size: 30px; margin-top: 10px; }
    .results.dense .tarot-face .cn { font-size: 13px; }
    .spread-btn { width: 46%; }
  }
</style>
</head>
<body>
<div id="stars"></div>

<main>
  <header>
    <div class="moon">🌙</div>
    <h1>星语塔罗</h1>
    <p class="subtitle">静心 · 提问 · 聆听牌面的低语</p>
    <div class="divider"></div>
  </header>

  <!-- 第一步:提问与选牌阵 -->
  <section class="panel" id="setup">
    <input class="question-box" id="question" type="text" maxlength="60"
           placeholder="写下你的问题,牌阵会针对它给出解答(留空则为整体指引)……">
    <p class="domain-hint" id="domainHint"></p>
    <div class="spreads" id="spreadBox"></div>
    <button class="go-btn" id="startBtn">开始占卜</button>
  </section>

  <!-- 第二步:洗牌与选牌 -->
  <section class="stage" id="pickStage">
    <p class="hint" id="pickHint">洗牌中……</p>
    <div class="fan" id="fan"></div>
  </section>

  <!-- 第三步:翻牌与解读 -->
  <section class="stage" id="resultStage">
    <p class="hint" id="resultHint">轻触卡牌,揭示牌面</p>
    <div class="results" id="results"></div>
    <div class="reading" id="reading"></div>
    <div class="again" id="againBox" style="display:none">
      <button class="link-btn" id="againBtn">再占一次</button>
    </div>
  </section>
</main>

<footer>
  塔罗是一面映照内心的镜子,而非既定的命运。<br>
  仅供娱乐与自我探索,重要决定请交给你自己的智慧。✨
</footer>

<script>
/* =========================================================
   牌库:22 张大阿卡纳(含 感情/事业/财务 领域解读)
   字段:中文名, 英文名, 序号, 图形, 正位关键词, 正位释义,
        逆位关键词, 逆位释义, {love, career, wealth}
   ========================================================= */
const MAJOR = [
  ["愚者","The Fool","0","🃏","自由 / 冒险 / 新的开始","你正站在一段旅程的起点。愚者鼓励你放下过度的算计,带着好奇与信任向前迈出一步——未知里藏着礼物。","鲁莽 / 迷失方向","当心因冲动或逃避而偏离正轨。先停下来看清脚下,再决定要不要跳。",
   {love:"一段轻盈自由的关系或崭新的心动正在靠近,别用过去的框架束缚它",career:"适合尝试新领域、新项目,初生牛犊的勇气就是你的资产",wealth:"可以尝试新的开源方式,但要避免无计划的冲动消费"}],
  ["魔术师","The Magician","I","🪄","创造 / 行动力 / 心想事成","资源与才能已在你手中,天时地利俱备。此刻专注意念、付诸行动,你有能力把想法变为现实。","三心二意 / 空谈","能量正在被分散或滥用。少一些花哨的计划,多一点脚踏实地的执行。",
   {love:"主动出击胜过默默等待,真诚的表达会得到回应",career:"资源齐备,正是启动计划、展示才能的窗口期",wealth:"善用技能变现,是谈判与签约的好时机"}],
  ["女祭司","The High Priestess","II","🌒","直觉 / 静观 / 潜意识","答案不在外界的喧嚣里,而在你的直觉深处。安静下来,倾听内心细微的声音,它早已知道方向。","忽视直觉 / 秘而不宣","你可能压抑了内心真实的感受,或忽略了显而易见的暗示。诚实面对自己。",
   {love:"感情宜静观其变,答案藏在你的直觉里,不必急着挑明",career:"宜观察积累、少说多听,还不到摊牌的时候",wealth:"暂缓大额决策,先把信息研究透再出手"}],
  ["女皇","The Empress","III","🌾","丰盛 / 滋养 / 感受之美","这是一张丰收与孕育之牌。好好照顾自己与所爱之人,享受生活的质感,你付出的爱正在开花结果。","匮乏感 / 过度依赖","当心以爱为名的控制,或因安逸而停滞。先把自己的杯子倒满。",
   {love:"感情进入滋养升温期,享受被爱,也慷慨地付出",career:"成果趋于成熟,创意型的工作尤其顺遂",wealth:"财务丰盈有余裕,适度享受生活并无不可"}],
  ["皇帝","The Emperor","IV","🏛️","秩序 / 责任 / 掌控","用理性与纪律为生活立起框架。此刻需要你像领导者一样承担责任、制定规则,稳定局面。","僵化 / 强权","过度的控制欲正在让关系或局面变得僵硬。权威不等于不容置疑。",
   {love:"关系需要承诺与稳定的框架,但当心控制欲盖过温度",career:"建立制度与权威的时机,大胆承担领导责任",wealth:"以纪律理财,长期规划优于短线投机"}],
  ["教皇","The Hierophant","V","📜","传统 / 求教 / 精神指引","向有经验的人求教,或回到经过检验的方法上来。传统与规范此刻是你的助力而非束缚。","教条 / 盲从","别人的地图未必适合你的路。质疑那些「理所当然」,走出自己的理解。",
   {love:"传统稳定的相处方式更适合当下,长辈的意见值得一听",career:"向导师与前辈求教,遵循行业规范行事更稳",wealth:"选择稳健合规的渠道,别碰规则模糊的地带"}],
  ["恋人","The Lovers","VI","💞","爱 / 结合 / 价值抉择","一段真诚的联结正在发生,或一个关乎内心价值的选择摆在面前。跟随爱与真实,而非恐惧。","失衡 / 犹豫不决","关系或选择中出现了不一致。逃避抉择本身也是一种抉择,诚实沟通吧。",
   {love:"心意相通的联结正在发生,忠于内心去选择",career:"合作关系是成败关键,选择与你价值观一致的伙伴",wealth:"面临取舍时,选长期价值而非眼前诱惑"}],
  ["战车","The Chariot","VII","🏇","意志 / 胜利 / 勇往直前","握紧缰绳,带着决心冲刺。只要方向明确、意志坚定,眼前的障碍终将被你碾过。","失控 / 方向不明","冲得太猛却不知去向何方。先校准目标,别让情绪抢走方向盘。",
   {love:"主动争取才有进展,拿出行动力与方向感",career:"目标明确就强势推进,胜利已在望",wealth:"进取无妨,但握紧方向盘,别让欲望失速"}],
  ["力量","Strength","VIII","🦁","勇气 / 温柔的坚定 / 驯服","真正的力量不是压制,而是以温柔与耐心驯服内心的猛兽。你比自己想象的更坚韧。","自我怀疑 / 急躁","内心的恐惧或急躁正在消耗你。对自己温柔一点,力量会回来的。",
   {love:"用温柔与耐心化解摩擦,这段感情的韧性正在增强",career:"面对难缠的局面,软实力比硬碰硬更有效",wealth:"克制欲望型消费,耐心是复利最好的朋友"}],
  ["隐士","The Hermit","IX","🏮","独处 / 内省 / 寻找答案","是时候暂离喧嚣,提一盏灯走向内心。独处不是孤僻,而是为了看清自己真正想要什么。","封闭 / 过度孤立","反思变成了逃避,独处变成了隔绝。答案想清楚了,就该回到人群中去。",
   {love:"也许需要一段独处来想清楚自己要什么,慢即是快",career:"沉淀打磨专业能力,答案在安静的深耕里",wealth:"减少折腾,守成优于扩张"}],
  ["命运之轮","Wheel of Fortune","X","☸️","转机 / 周期 / 顺势而为","命运之轮正在转动,变化即将到来。抓住上升的时机,接纳无法控制的部分——风向正在变好。","逆流 / 时运不济","眼下或许诸事不顺,但轮子不会永远停在低点。耐心等待,守好基本盘。",
   {love:"缘分的齿轮在转动,顺其自然反而会有转机",career:"外部环境正在变化,抓住上升的时间窗口",wealth:"周期在轮转,懂得见好就收、逢低布局"}],

function buildDeck() {
  const deck = MAJOR.map((m, i) => ({
    id: "M" + i, major: true, cn: m[0], en: m[1], num: m[2], glyph: m[3],
    upKeys: m[4], upText: m[5], revKeys: m[6], revText: m[7], d: m[8]
  }));
  for (const suitCn in SUITS) {
    const s = SUITS[suitCn];
    RANKS.forEach((r, i) => {
      deck.push({
        id: suitCn + i, major: false, suit: suitCn,
        cn: suitCn + r[0],
        en: r[1] + " of " + s.en,
        num: suitCn,
        glyph: s.glyph,
        essence: r[2],
        upKeys: r[2] + " · 关乎" + s.theme,
        upText: "在" + s.theme + "的领域中," + r[3] + "。",
        revKeys: "受阻的" + r[2],
        revText: "在" + s.theme + "的领域中," + r[4] + "。",
        upAct: r[3], revAct: r[4]
      });
    });
  }
  return deck;
}

const DOMAINS = {
  love:   { name:"感情",    kw:/爱情|感情|恋|喜欢|暗恋|复合|分手|结婚|婚姻|脱单|表白|挽回|对象|男朋友|女朋友|男友|女友|前任|桃花|婚|情/ },
  career: { name:"事业与学业", kw:/工作|事业|职|升职|加薪|跳槽|面试|offer|老板|同事|创业|项目|考试|学业|考研|考公|学习|论文|毕业|晋升|转行/ },
  wealth: { name:"财务",    kw:/钱|财|投资|股票|基金|收入|工资|买房|欠|债|赚|亏|理财/ }
};
function detectDomain(q) {
  if (!q) return null;
  for (const key in DOMAINS) if (DOMAINS[key].kw.test(q)) return key;
  return "general";
}
function domainName(key) { return key && DOMAINS[key] ? DOMAINS[key].name : "整体"; }

/* 针对某张牌 × 某个领域,给出领域解读句 */
function domainLine(p, dKey) {
  if (!dKey || dKey === "general") return "";
  const c = p.card;
  if (c.major) {
    let line = c.d[dKey];
    if (p.reversed) line += "——此牌逆位,这股能量目前以受阻或过度的方式呈现,请对照上面的逆位提示调整";
    return "落在「" + domainName(dKey) + "」的问题上:" + line + "。";
  }
  const frame = SUITS[c.suit].d[dKey];
  const act = p.reversed ? c.revAct : c.upAct;
  return "落在「" + domainName(dKey) + "」的问题上:" + frame + ";此刻的功课是「" + c.essence + "」——" + act + "。";
}

function startDivination() {
  qDomain = detectDomain($("question").value.trim());
  $("setup").style.display = "none";
  $("pickStage").classList.add("show");
  buildFan();
}

function buildFan() {
  const fan = $("fan");
  fan.innerHTML = "";
  const N = Math.max(16, spread.count + 8);
  const spreadDeg = Math.min(90, innerWidth / 7);
  const cards = [];
  for (let i = 0; i < N; i++) {
    const c = document.createElement("div");
    c.className = "fan-card shuffling";
    const r = (i - (N - 1) / 2) * (spreadDeg / N);
    c.style.setProperty("--r", r + "deg");
    c.style.transform = "rotate(" + r + "deg)";
    c.style.zIndex = i;
    c.innerHTML = '<div class="card-back">✦</div>';
    fan.appendChild(c);
    cards.push(c);
  }
  $("pickHint").textContent = "洗牌中……请在心中默念你的问题";

  setTimeout(() => {
    cards.forEach(c => c.classList.remove("shuffling"));
    updatePickHint();
    cards.forEach(c => c.addEventListener("click", () => pickCard(c), { once: true }));
  }, 2600);
}

function updatePickHint() {
  const left = spread.count - picked.length;
  $("pickHint").innerHTML = left > 0
    ? "凭直觉抽取 <em>" + left + "</em> 张牌"
    : "命运已然落定……";
}

function pickCard(el) {
  if (picked.length >= spread.count) return;
  el.classList.add("picked");
  let card;
  do { card = DECK[Math.floor(Math.random() * DECK.length)]; }
  while (picked.some(p => p.card.id === card.id));
  picked.push({ card, reversed: Math.random() < 0.4 });
  updatePickHint();
  if (picked.length === spread.count) setTimeout(showResults, 700);
}

function showResults() {
  $("pickStage").classList.remove("show");
  const results = $("results");
  results.innerHTML = "";
  results.classList.toggle("dense", spread.count >= 8);
  picked.forEach((p, i) => {
    const [label, sub] = spread.labels[i];
    const slot = document.createElement("div");
    slot.className = "slot";
    slot.innerHTML =
      '<div class="slot-label">' + label + "</div>" +
      '<div class="slot-sub">' + sub + "</div>" +
      '<div class="flip" data-i="' + i + '">' +
        '<div class="flip-inner">' +
          '<div class="face back"><div class="card-back" style="font-size:40px">✦</div></div>' +
          '<div class="face front">' +
            '<div class="tarot-face' + (p.reversed ? " reversed-face" : "") + '">' +
              '<div class="inner-rotate" style="display:flex;flex-direction:column;align-items:center;flex:1;justify-content:space-between;width:100%">' +
                '<div class="num">' + p.card.num + "</div>" +
                '<div class="glyph">' + p.card.glyph + "</div>" +
                '<div><div class="cn">' + p.card.cn + '</div><div class="en">' + p.card.en + "</div></div>" +
              "</div>" +
            "</div>" +
          "</div>" +
        "</div>" +
      "</div>" +
      '<div class="orientation-box" style="min-height:34px"></div>';
    results.appendChild(slot);
    const flip = slot.querySelector(".flip");
    flip.addEventListener("click", () => reveal(flip, slot, p), { once: true });
  });
  $("resultStage").classList.add("show");
}

function reveal(flip, slot, p) {
  flip.classList.add("revealed");
  setTimeout(() => {
    slot.querySelector(".orientation-box").innerHTML =
      '<span class="orientation ' + (p.reversed ? "rev" : "up") + '">' +
      (p.reversed ? "逆位" : "正位") + "</span>";
  }, 500);
  revealedCount++;
  if (revealedCount === spread.count) {
    $("resultHint").textContent = "牌面已揭晓";
    setTimeout(showReading, 1100);
  } else {
    $("resultHint").textContent = "还有 " + (spread.count - revealedCount) + " 张牌等待揭示";
  }
}

  const reading = $("reading");

  let html = "";
  picked.forEach((p, i) => {
    const [label, sub] = spread.labels[i];
    const keys = p.reversed ? p.card.revKeys : p.card.upKeys;
    const text = p.reversed ? p.card.revText : p.card.upText;
    const dLine = domainLine(p, qDomain);
    html +=
      '<div class="reading-card">' +
        "<h3>" + label + " · " + p.card.cn + "(" + (p.reversed ? "逆位" : "正位") + ")</h3>" +
        '<div class="pos-meaning">此位置代表:' + sub + "</div>" +
        '<div class="keywords">关键词:' + keys + "</div>" +
        "<p>" + text + "</p>" +
        (dLine ? '<p class="domain-line">' + dLine + "</p>" : "") +
      "</div>";
  });
  html += '<div class="summary"><h3>✦ 问题解答</h3>' + answer(q) + "</div>";
  reading.innerHTML = html;
  reading.classList.add("show");
  $("againBox").style.display = "block";
  reading.scrollIntoView({ behavior: "smooth", block: "start" });
}

/* =========================================================
   综合解答:结合问题主题、正逆位比例与结果位的牌
   ========================================================= */
function answer(q) {
  const revN = picked.filter(p => p.reversed).length;
  const total = picked.length;
  const outcome = picked[total - 1];
  const outLabel = spread.labels[total - 1][0];
  const oKeys = outcome.reversed ? outcome.card.revKeys : outcome.card.upKeys;
  const oText = outcome.reversed ? outcome.card.revText : outcome.card.upText;

  let html = "";
  if (q) {
    html += "<p>你问:「" + q + "」" +
      (qDomain && qDomain !== "general"
        ? "——这是一个关于<b>" + domainName(qDomain) + "</b>的问题,以下解答将围绕它展开。"
        : "——牌阵将以整体的视角回应你。") + "</p>";
  }

  let tone;
  if (revN === 0) {
    tone = "牌面全部以正位呈现,能量顺畅而明朗:你与所问之事正处在同频的状态,阻力很小。";
  } else if (revN / total <= 0.5) {
    tone = "牌面正位居多、间有逆位:大方向是通畅的,但逆位牌指出的盲点正是这次占卜要送你的提醒。";
  } else if (revN < total) {
    tone = "牌面以逆位为主:能量暂时受阻,当下更适合调整与梳理,而非强行推进。";
  } else {
    tone = "牌面全部逆位——这不是凶兆,而是一面转向内在的镜子:先安顿好自己,外界的路自然会清晰。";
  }
  html += "<p>" + tone + "</p>";

  html += '<p class="answer-line">✧ 关键在「' + outLabel + "」位:" + outcome.card.cn +
    "(" + (outcome.reversed ? "逆位" : "正位") + ")——" + oKeys + "。" + oText + "</p>";

  let verdict;
  if (!outcome.reversed && revN / total <= 0.5) {
    verdict = "综合来看,答案偏向<b>肯定与顺利</b>:按你心中的方向坚定走下去,结果值得期待。";
  } else if (outcome.reversed && revN / total > 0.5) {
    verdict = "综合来看,当下<b>时机未熟</b>:与其硬闯,不如先处理逆位牌揭示的课题,时机成熟时再行动,结果会完全不同。";
  } else {
    verdict = "综合来看,事情<b>存在变数但可以争取</b>:结果不是注定的,牌面中逆位所指的功课,正是你能扭转走向的抓手。";
  }
  html += "<p>" + verdict + "</p>";
  html += "<p style='color:var(--dim);font-size:13.5px'>塔罗展示的是当下能量的走向,而握着方向盘的,始终是你自己。</p>";
  return html;
}
</script>
